<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraftMart — Messages</title>
<meta name="description" content="CraftMart — a marketplace for authentic Sri Lankan handmade crafts, sold directly by artisans.">
<meta name="theme-color" content="#245C45">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js" defer></script>
</head>
<body>
<div class="app"><aside class="side"><a class="logo" href="index.html" style="color:#FFFFFF"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#245C45"></rect><path d="M17 7c4 4 6 8 6 11a6 6 0 0 1-12 0c0-3 2-7 6-11Z" fill="#FAF7F0"></path><path d="M17 13v13" stroke="#C87955" stroke-width="2.2" stroke-linecap="round"></path></svg><span>Craft<span style="color:#C87955">Mart</span></span></a><div class="role">My account</div><nav class="snav" aria-label="My account"><a href="account.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>Dashboard</span></a><a href="orders.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>My orders</span><span class="count">2</span></a><a href="messages.html" class="on"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Messages</span><span class="count">2</span></a><a href="account.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span>Wishlist</span></a><a href="chatbot.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="3" y="8" width="18" height="12" rx="4"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M9 13v1M15 13v1"/></svg><span>Ask Kala</span></a><a href="profile.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile &amp; settings</span></a><a href="index.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/></svg><span>Back to shop</span></a></nav>
<div class="side-user"><span class="av" style="background:#C87955">IW</span><div style="flex:1;min-width:0"><div style="font-weight:600;color:#fff;font-size:14px">Ishara Wickramasinghe</div><div style="font-size:12.5px;color:#9DB8A8">Customer</div></div><a class="ibtn" href="index.html" aria-label="Sign out" style="color:#DCE6DF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></a></div></aside><main class="main" id="main">
<div class="apptop"><div style="flex:1;min-width:240px"><h1>Messages</h1><p class="muted" style="margin-top:4px">Talk directly with artisans about orders, sizes and custom pieces.</p></div>
<label class="search" style="max-width:300px;background:#fff"><span class="sr">Search</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="search" placeholder="Search…"></label>
<a class="ibtn" href="#" aria-label="Notifications" style="background:#fff;border:1px solid #E8E1D3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot">3</span></a></div>
<section class="inbox" aria-label="Inbox"><div class="clist"><div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #E8E1D3"><label class="search" style="max-width:none;height:42px;background:#FBF9F4"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="sr">Search conversations</span><input id="cq" type="search" placeholder="Search artisans"></label></div><div id="convs"></div></div>
<div class="chat"><div class="row" style="padding:14px 20px;border-bottom:1px solid #E8E1D3;background:#fff;gap:12px;flex-wrap:wrap"><span class="av" id="h-av"></span><div style="flex:1;min-width:160px"><strong id="h-name"></strong><div class="row muted" style="gap:6px;font-size:12.5px"><span class="online"></span> <span id="h-sub"></span></div></div><a class="btn btn-light btn-sm" id="h-shop" href="shop.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/></svg> View shop</a></div>
<div id="ctx"></div><div class="msgs" id="msgs" aria-live="polite"></div>
<div class="row" style="gap:8px;padding:0 20px 10px;flex-wrap:wrap" id="quick"><button class="chip" data-q="Thank you!">Thank you!</button><button class="chip" data-q="When will it arrive?">When will it arrive?</button><button class="chip" data-q="Do you take custom orders?">Do you take custom orders?</button></div>
<form class="composer" id="cmp"><button type="button" class="ibtn" aria-label="Attach file" data-toast="Attachments are coming soon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m21.4 11-8.8 8.8a5.5 5.5 0 0 1-7.8-7.8l8.8-8.8a3.7 3.7 0 0 1 5.2 5.2l-8.8 8.8a1.8 1.8 0 0 1-2.6-2.6l8.1-8.1"/></svg></button><label class="sr" for="mi">Message</label><input id="mi" class="input" style="border-radius:999px" placeholder="Write a message…" autocomplete="off"><button class="send" type="submit" aria-label="Send message"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form></div></section></main></div>
<script>document.addEventListener("DOMContentLoaded",function(){const $=s=>document.querySelector(s);let C=CM.store.get('cm_msgs',null)||[{"id": "np", "ini": "NP", "col": "#C87955", "name": "Nimal Perera", "shop": "Molagoda Pottery", "artisan": "Nimal Perera", "ctx": {"order": "CM-24817", "item": "Terracotta Water Pot \u00b7 Medium", "img": "clay-pot", "status": "Shipped"}, "unread": 1, "msgs": [{"me": true, "t": "Hi Nimal! I just ordered the medium water pot. Could you pack it well? It's going to Kandy.", "at": "Yesterday 13:48"}, {"me": false, "t": "Ayubowan! Thank you for your order. I'm packing it with extra coir so it travels safely. I'll hand it to Domex tomorrow morning.", "at": "Yesterday 14:05"}, {"me": false, "t": "Here it is before packing \u2014 fired last week.", "img": "clay-pot", "at": "Yesterday 14:06"}]}, {"id": "sa", "ini": "SA", "col": "#B3352A", "name": "Sunil Ariyapala", "shop": "Ambalangoda Masks", "artisan": "Sunil Ariyapala", "ctx": null, "unread": 1, "msgs": [{"me": true, "t": "Do you make Naga Raksha masks in a larger size?", "at": "Mon 10:12"}, {"me": false, "t": "Yes! I can paint a custom Naga Raksha for you in 45 cm. It takes about 3 weeks. Shall I send a sketch?", "at": "Mon 11:40"}]}, {"id": "fr", "ini": "FR", "col": "#23466B", "name": "Fathima Rizvi", "shop": "Matale Batik", "artisan": "Fathima Rizvi", "ctx": null, "unread": 0, "msgs": [{"me": true, "t": "The sarong is beautiful \u2014 just left a review.", "at": "Sun 18:20"}, {"me": false, "t": "Thank you for the lovely review!", "at": "Sun 19:02"}]}, {"id": "ms", "ini": "MS", "col": "#245C45", "name": "Malini Silva", "shop": "Galle Beeralu", "artisan": "Malini Silva", "ctx": null, "unread": 0, "msgs": [{"me": false, "t": "The doily will be ready on the 23rd.", "at": "12 Nov"}]}];let cur=C[0].id;const save=()=>CM.store.set('cm_msgs',C);
const REPLY=['Thank you! I\'ll get back to you shortly.','Noted — I\'ll check and reply within a couple of hours.','Happy to help! Let me look into that for you.'];
function now(){const d=new Date();return 'Today '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function renderList(){const q=$('#cq').value.trim().toLowerCase();$('#convs').innerHTML=C.filter(c=>!q||c.name.toLowerCase().includes(q)).map(c=>{const last=c.msgs[c.msgs.length-1];return `<button class="conv${c.id===cur?' on':''}" data-c="${c.id}"><span class="av" style="background:${c.col}">${c.ini}</span><span style="flex:1;min-width:0"><span class="row between"><strong style="font-size:14.5px">${c.name}</strong><span class="muted" style="font-size:12px">${(last.at||'').replace('Today ','')}</span></span><span class="muted" style="display:block;font-size:12.5px">${c.shop}</span><span style="display:block;font-size:13.5px;color:${c.unread?'#1F1F1F':'#5F5A52'};font-weight:${c.unread?600:400};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${CM.esc(last.t)}</span></span>${c.unread?`<span class="dot" style="position:static;margin-top:20px">${c.unread}</span>`:''}</button>`}).join('');
document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.c;open();}));}
function renderChat(){const c=C.find(x=>x.id===cur);$('#h-av').textContent=c.ini;$('#h-av').style.background=c.col;$('#h-name').textContent=c.name;$('#h-sub').textContent=c.shop+' · usually replies within 2 hrs';$('#h-shop').href='shop.html?artisan='+encodeURIComponent(c.artisan);
$('#ctx').innerHTML=c.ctx?`<div class="row" style="margin:14px 20px 0;padding:12px 14px;background:#fff;border:1px solid #E8E1D3;border-radius:14px;gap:12px"><img class="thumb" src="assets/img/${c.ctx.img}.svg" alt=""><div style="flex:1"><div style="font-size:12.5px" class="muted">About order #${c.ctx.order}</div><strong style="font-size:14.5px">${c.ctx.item}</strong></div><span class="badge b-blue">${c.ctx.status}</span><a class="btn btn-light btn-sm" href="orders.html">Track</a></div>`:'';
$('#msgs').innerHTML=c.msgs.map(m=>m.me?`<div class="bub-me">${CM.esc(m.t)}<div class="bub-meta" style="color:#CFE0D6;text-align:right">${m.at}${m.pending?' · Sending':' · Read'}</div></div>`:`<div class="row" style="gap:10px;align-items:flex-end"><span class="av" style="width:32px;height:32px;font-size:11px;background:${c.col}">${c.ini}</span><div class="bub-bot"${m.img?' style="padding:6px"':''}>${m.img?`<img src="assets/img/${m.img}.svg" alt="Photo from ${c.name}" style="width:220px;height:160px;object-fit:cover;border-radius:12px;display:block"><div style="padding:6px 8px 2px">${CM.esc(m.t)}</div>`:CM.esc(m.t)}<div class="bub-meta"${m.img?' style="padding:0 8px 4px"':''}>${m.at}</div></div></div>`).join('')+(c.typing?`<div class="row" style="gap:10px;align-items:flex-end"><span class="av" style="width:32px;height:32px;font-size:11px;background:${c.col}">${c.ini}</span><div class="bub-bot typing"><span></span><span></span><span></span></div></div>`:'');
$('#msgs').scrollTop=$('#msgs').scrollHeight;$('#mi').placeholder='Write a message to '+c.name.split(' ')[0]+'…';}
function open(){const c=C.find(x=>x.id===cur);c.unread=0;save();renderList();renderChat();}
function send(t){t=(t||'').trim();if(!t)return;const c=C.find(x=>x.id===cur);c.msgs.push({me:true,t:t,at:now()});c.typing=true;save();renderList();renderChat();
setTimeout(()=>{c.typing=false;c.msgs.push({me:false,t:REPLY[Math.floor(Math.random()*REPLY.length)],at:now()});save();renderList();renderChat();},2200);}
$('#cmp').addEventListener('submit',e=>{e.preventDefault();send($('#mi').value);$('#mi').value='';});document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.q)));$('#cq').addEventListener('input',renderList);
C.forEach(c=>c.typing=false);open();});</script>
</body>
</html>
