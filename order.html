<body>
<div class="app"><aside class="side"><a class="logo" href="index.html" style="color:#FFFFFF"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#245C45"></rect><path d="M17 7c4 4 6 8 6 11a6 6 0 0 1-12 0c0-3 2-7 6-11Z" fill="#FAF7F0"></path><path d="M17 13v13" stroke="#C87955" stroke-width="2.2" stroke-linecap="round"></path></svg><span>Craft<span style="color:#C87955">Mart</span></span></a><div class="role">My account</div><nav class="snav" aria-label="My account"><a href="account.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>Dashboard</span></a><a href="orders.html" class="on"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>My orders</span><span class="count">2</span></a><a href="messages.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Messages</span><span class="count">2</span></a><a href="account.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span>Wishlist</span></a><a href="chatbot.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="3" y="8" width="18" height="12" rx="4"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M9 13v1M15 13v1"/></svg><span>Ask Kala</span></a><a href="profile.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile &amp; settings</span></a><a href="index.html" class=""><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/></svg><span>Back to shop</span></a></nav>
<div class="side-user"><span class="av" style="background:#C87955">IW</span><div style="flex:1;min-width:0"><div style="font-weight:600;color:#fff;font-size:14px">Ishara Wickramasinghe</div><div style="font-size:12.5px;color:#9DB8A8">Customer</div></div><a class="ibtn" href="index.html" aria-label="Sign out" style="color:#DCE6DF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></a></div></aside><main class="main" id="main">
<nav class="crumbs" aria-label="Breadcrumb"><a href="account.html">Dashboard</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m9 18 6-6-6-6"/></svg><a href="orders.html">My orders</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m9 18 6-6-6-6"/></svg><span style="color:#2B2B2B;font-weight:600" id="cr"></span></nav>
<div class="row between" style="flex-wrap:wrap;gap:16px"><div><div class="row" style="gap:12px;flex-wrap:wrap"><h1 style="font-size:32px" id="title"></h1><span class="badge" id="badge"></span></div><p class="muted" style="margin-top:4px" id="meta"></p></div>
<div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn btn-light btn-sm" onclick="window.print()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> Invoice</button><a class="btn btn-light btn-sm" href="chatbot.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="3" y="8" width="18" height="12" rx="4"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M9 13v1M15 13v1"/></svg> Get help</a><button class="btn btn-danger btn-sm" id="cancel" hidden>Cancel order</button></div></div>
<div class="cols-21"><section class="panel" aria-labelledby="tr-h"><div class="panel-h"><h2 id="tr-h" style="font-size:19px">Tracking</h2><span class="muted" style="font-size:13.5px" id="courier"></span></div>
<div class="bartrack" style="height:8px;margin-bottom:24px"><div class="barfill" id="prog"></div></div><div class="tl" id="tl"></div></section>
<div style="display:flex;flex-direction:column;gap:20px"><section class="panel"><h2 style="font-size:18px;margin-bottom:12px">Delivery address</h2><p><strong id="nm"></strong></p><p class="muted" style="font-size:14.5px" id="addr"></p><p class="row" style="gap:8px;margin-top:12px;font-size:14px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M10 17h4V5H2v12h3"/><path d="M14 8h4l4 4v5h-3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg> <span id="dlv"></span></p></section>
<section class="panel"><h2 style="font-size:18px;margin-bottom:14px">Payment summary</h2><div style="display:flex;flex-direction:column;gap:10px" id="pay"></div></section></div></div>
<section class="panel" aria-labelledby="it-h"><div class="panel-h"><h2 id="it-h" style="font-size:19px">Items in this order</h2><span class="muted" style="font-size:13.5px">Shipped separately by each artisan</span></div><div id="items"></div></section></main></div>
<script>document.addEventListener("DOMContentLoaded",function(){const I={"pkg": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" ><path d=\"m7.5 4.27 9 5.15\"/><path d=\"M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z\"/><path d=\"m3.3 7 8.7 5 8.7-5\"/><path d=\"M12 22V12\"/></svg>", "truck": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" ><path d=\"M10 17h4V5H2v12h3\"/><path d=\"M14 8h4l4 4v5h-3\"/><circle cx=\"7.5\" cy=\"17.5\" r=\"2.5\"/><circle cx=\"16.5\" cy=\"17.5\" r=\"2.5\"/></svg>", "home": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" ><path d=\"m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/><path d=\"M9 22V12h6v10\"/></svg>", "store": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" ><path d=\"M3 9l1.5-5h15L21 9\"/><path d=\"M4 9v11h16V9\"/><path d=\"M3 9h18\"/><path d=\"M9 20v-6h6v6\"/></svg>", "x": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" ><path d=\"M18 6 6 18M6 6l12 12\"/></svg>", "check": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" ><path d=\"M20 6 9 17l-5-5\"/></svg>", "msg": "<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" ><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>"};const $=s=>document.querySelector(s);const id=new URLSearchParams(location.search).get('id');const o=(id&&CM.findOrder(id))||CM.getOrders()[0];const B={Processing:'b-amber',Shipped:'b-blue',Delivered:'b-green',Cancelled:'b-red'};
function render(){$('#cr').textContent='#'+o.id;$('#title').textContent='Order #'+o.id;$('#badge').className='badge '+B[o.status];$('#badge').textContent=o.status;
const n=new Set(o.items.map(i=>CM.byId[i.id].artisan)).size;const cnt=o.items.reduce((a,i)=>a+i.qty,0);$('#meta').textContent='Placed '+o.date+(o.time?', '+o.time:'')+' · '+cnt+' item'+(cnt>1?'s':'')+' from '+n+' artisan'+(n>1?'s':'')+(o.pay?' · '+o.pay:'');
$('#courier').textContent=o.courier||'Tracking number added when shipped';$('#cancel').hidden=o.status!=='Processing';
const S=['Order placed','Confirmed by artisan','Packed & handed to courier','In transit','Delivered'];const D=['Payment confirmed','The artisan is preparing your items','Collected from the workshop','On the way to '+((o.address||'Kandy').split(',').slice(-1)[0].trim()),o.status==='Delivered'?(o.note||''):'Expected '+(o.eta||'soon')];
let cur={Processing:1,Shipped:3,Delivered:5,Cancelled:-1}[o.status];
if(cur===-1){$('#tl').innerHTML=`<div class="tl-i done"><span class="tl-dot">${I.check}</span><div><strong>Order placed</strong><div class="muted" style="font-size:14px">${o.date}</div></div></div><div class="tl-i"><span class="tl-dot" style="background:#F8E1DE;border-color:#E8C3BC;color:#9B2C1F">${I.x}</span><div><strong>Cancelled</strong><div class="muted" style="font-size:14px">${o.note||'Refund issued to original payment method'}</div></div></div>`;$('#prog').style.width='0%';}
else{$('#prog').style.width=(cur/5*100)+'%';const ic=[I.check,I.store,I.pkg,I.truck,I.home];$('#tl').innerHTML=S.map((s,i)=>`<div class="tl-i ${i<cur?'done':(i===cur?'now':'')}"><span class="tl-dot">${i<cur?I.check:ic[i]}</span><div><strong>${s}</strong><div class="muted" style="font-size:14px">${CM.esc(D[i])}</div></div></div>`).join('');}
$('#nm').textContent=o.name||'Ishara Wickramasinghe';$('#addr').textContent=(o.address||'No. 24, Lake View Gardens, Peradeniya Road, Kandy 20000')+' · '+(o.phone||'+94 77 123 4567');$('#dlv').textContent=o.delivery||'Standard delivery';
const sub=o.sub||o.items.reduce((a,i)=>a+CM.lineOf(i).total,0);let h=`<div class="sumrow"><span class="muted">Subtotal</span><span>Rs ${CM.fmt(sub)}</span></div>`;if(o.disc)h+=`<div class="sumrow" style="color:#1D6B47"><span>Promo CRAFT15</span><span>– Rs ${CM.fmt(o.disc)}</span></div>`;h+=`<div class="sumrow"><span class="muted">Delivery</span><span>${o.ship?'Rs '+CM.fmt(o.ship):'Free'}</span></div>`;if(o.wrap)h+=`<div class="sumrow"><span class="muted">Gift wrapping</span><span>Rs 250</span></div>`;h+=`<div class="divider"></div><div class="sumrow" style="font-weight:700;font-size:17px"><span>Total</span><span style="color:#245C45">Rs ${CM.fmt(o.total)}</span></div>`;$('#pay').innerHTML=h;
$('#items').innerHTML=o.items.map(i=>{const l=CM.lineOf(i);return `<div class="row" style="gap:16px;padding:16px 0;border-bottom:1px solid #F0EADF;flex-wrap:wrap"><img class="thumb" src="${CM.img(l.p)}" alt="" style="width:72px;height:72px;border-radius:14px"><div style="flex:1;min-width:200px"><a href="product.html?id=${l.p.id}" style="font-weight:600;color:#1F1F1F;text-decoration:none">${CM.esc(l.p.name)}</a><div class="muted" style="font-size:13.5px">by ${l.p.artisan} · ${CM.esc(l.variant)} · Qty ${l.qty}</div></div><div style="text-align:right"><div style="font-weight:700">Rs ${CM.fmt(l.total)}</div><a href="messages.html" class="row" style="gap:6px;font-size:13.5px;font-weight:600;text-decoration:none;margin-top:6px;justify-content:flex-end">${I.msg} Message artisan</a></div></div>`}).join('');}
$('#cancel').addEventListener('click',()=>{if(!confirm('Cancel this order?'))return;const list=CM.store.get('cm_orders',[]);const x=list.find(z=>z.id===o.id);if(x){x.status='Cancelled';x.note='Cancelled by you · refund in 3–5 days';CM.store.set('cm_orders',list);Object.assign(o,x);}else{o.status='Cancelled';}render();CM.toast('Order cancelled');});
render();});</script>
</body>
</html>
